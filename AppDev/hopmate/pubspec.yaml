name: hopmate
description: "A new Flutter project."
publish_to: 'none' # prevents publishing to pub.dev

version: 1.0.0+1 # app version (major.minor.patch+build)

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  webview_flutter: ^4.12.0

  # Authentication & backend
  supabase_flutter: ^2.10.0

  # Splash screen
  flutter_native_splash: ^2.4.6

  # UI & icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  url_launcher: ^6.1.10

  # Maps & location
  geolocator: ^14.0.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  flutter_map_location_marker: ^10.1.0
  flutter_polyline_points: ^3.0.1
  location: ^8.0.1
  http: ^1.5.0
  maplibre_gl: ^0.22.0

  # State management & navigation
  get: ^4.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 # recommended lint rules

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
